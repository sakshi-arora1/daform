<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 770" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
  </defs>
  <rect width="1100" height="770" fill="#fff"/>
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="600">Block Operators: contracts</text>

  <!-- Configuration -->
  <rect x="30" y="70" width="320" height="130" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="46" y="96" font-weight="600">Configuration (per site)</text>
  <text x="46" y="120" fill="#57606a">block library · editor sheet</text>
  <text x="46" y="148" font-family="ui-monospace, Menlo, monospace" font-size="12">cards | multi  (existing)</text>
  <rect x="40" y="160" width="300" height="28" rx="4" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="50" y="179" font-family="ui-monospace, Menlo, monospace" font-size="12">&lt;block&gt; | operator | &lt;module URL&gt;</text>

  <!-- Operator module -->
  <rect x="410" y="70" width="660" height="130" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="426" y="96" font-weight="600">Block operator module</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12">
    <text x="426" y="122">matches({ name, variant })   create(ctx) → instance</text>
    <text x="426" y="146">instance: update(ctx) · destroy() · resolve(position) · locate(itemId)</text>
    <text x="426" y="170">          outline.mount(container)   inspector.mount(container)</text>
  </g>
  <text x="426" y="191" fill="#57606a" font-size="12">both contracts optional · imported lazily · one instance per host</text>

  <line x1="350" y1="135" x2="406" y2="135" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="378" y="126" text-anchor="middle" font-size="11" fill="#57606a">name →</text>
  <text x="378" y="152" text-anchor="middle" font-size="11" fill="#57606a">module</text>

  <!-- Hosts -->
  <rect x="30" y="270" width="500" height="180" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="46" y="296" font-weight="600">Outline (DA)</text>
  <text x="46" y="318" fill="#57606a">block row · expand chevron</text>
  <rect x="46" y="332" width="468" height="104" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="60" y="356" font-weight="600">outline contract</text>
  <text x="60" y="378" font-family="ui-monospace, Menlo, monospace" font-size="12">outline.mount(container)</text>
  <text x="60" y="400">operator owns the nested tree: rendering, drag, menus</text>
  <text x="60" y="422" fill="#57606a">not implemented → today's single row</text>

  <rect x="570" y="270" width="500" height="180" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="586" y="296" font-weight="600">Block Inspector</text>
  <text x="586" y="318" fill="#57606a">panel for the block under the caret</text>
  <rect x="586" y="332" width="468" height="104" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="600" y="356" font-weight="600">inspector contract</text>
  <text x="600" y="378" font-family="ui-monospace, Menlo, monospace" font-size="12">inspector.mount(container)</text>
  <text x="600" y="400">operator owns the panel, in place of the fields form</text>
  <text x="600" y="422" fill="#57606a">not implemented / throws → today's fields form</text>

  <line x1="600" y1="200" x2="280" y2="266" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="880" y1="200" x2="820" y2="266" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="330" y="232" text-anchor="middle" font-size="12" fill="#57606a">create(ctx) · mount</text>
  <text x="872" y="236" font-size="12" fill="#57606a">create(ctx) · mount</text>

  <!-- ctx -->
  <rect x="30" y="490" width="1040" height="66" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="46" y="514" font-weight="600">ctx (same shape from both hosts)</text>
  <text x="46" y="540" font-family="ui-monospace, Menlo, monospace" font-size="12">name · variant · html · blockIndex · editable · styles · commit(html) · select(itemId) · onEditorSelect(cb)</text>
  <line x1="280" y1="450" x2="280" y2="486" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="820" y1="450" x2="820" y2="486" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Document -->
  <rect x="30" y="596" width="1040" height="120" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="46" y="620" font-weight="600">DA document (existing)</text>
  <rect x="46" y="632" width="490" height="72" rx="6" fill="#fff" stroke="#8c959f"/>
  <text x="60" y="654" font-weight="600">The operator's block</text>
  <text x="60" y="674">commit(html) replaces only this block, as one change</text>
  <text x="60" y="694" fill="#57606a" font-size="12">rejects: NOT_EDITABLE · STALE · INVALID_HTML · NO_EDITOR</text>
  <rect x="564" y="632" width="490" height="72" rx="6" fill="#fff" stroke="#8c959f"/>
  <text x="578" y="654" font-weight="600">Selection inside the block (existing canvas capability)</text>
  <text x="578" y="674" font-family="ui-monospace, Menlo, monospace" font-size="12">position { row, cell, textOffset? }</text>
  <text x="578" y="694" fill="#57606a" font-size="12">↔ item id via resolve / locate</text>

  <line x1="290" y1="556" x2="290" y2="628" stroke="#0969da" stroke-width="2" marker-end="url(#w)"/>
  <text x="300" y="582" font-size="12" fill="#0969da">commit(html)</text>
  <line x1="810" y1="560" x2="810" y2="628" stroke="#444" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="820" y="582" font-size="12" fill="#57606a">select / onEditorSelect</text>

  <!-- Legend -->
  <g font-size="12">
    <rect x="30" y="738" width="16" height="12" fill="#f6f8fa" stroke="#8c959f"/><text x="52" y="749">existing</text>
    <rect x="130" y="738" width="16" height="12" fill="#dafbe1" stroke="#1a7f37"/><text x="152" y="749">new contract</text>
    <rect x="260" y="738" width="16" height="12" fill="#fbefff" stroke="#8250df"/><text x="282" y="749">operator code (site)</text>
    <line x1="430" y1="744" x2="466" y2="744" stroke="#0969da" stroke-width="2" marker-end="url(#w)"/><text x="474" y="749">writes (only via commit)</text>
    <line x1="640" y1="744" x2="676" y2="744" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="684" y="749">creates / passes / syncs</text>
  </g>
</svg>
